<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: сторінка займає весь екран, відступи робимо самі через safe-area -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="color-scheme" content="dark">

  <!-- iOS: запуск як окрема програма з початкового екрана -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренування">
  <meta name="format-detection" content="telephone=no">

  <title>Щоденник тренувань</title>

  <!-- PWA: опис програми та іконки -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" id="back" href="#/profile" aria-label="Назад" hidden>‹</a>
    <button class="minimize-btn" id="minimize-btn" aria-label="Згорнути тренування">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <h1 id="title">Тренування</h1>
    <button class="clock-btn" id="clock-btn" aria-label="Таймер і секундомір" hidden>
      <span id="clock-time"></span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5.5 4L3 6.5M18.5 4L21 6.5"/></svg>
    </button>
    <button class="finish-btn" id="finish-btn">Завершити</button>
  </header>

  <!-- Нижня панель таймера і секундоміра: відкриває і наповнює її js/clock.js -->
  <div class="sheet-backdrop" id="clock-backdrop"></div>
  <div class="sheet" id="clock-sheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="clock-title">Годинник</h2>
    <div id="clock-panel"></div>
  </div>

  <main id="view"></main>

  <!-- Таймер відпочинку: смужка внизу екрана тренування, поки йде відлік (js/clock.js) -->
  <div class="rest-bar" id="rest-bar">
    <div class="rest-line"><div id="rest-line"></div></div>
    <strong id="rest-time"></strong>
    <div class="row">
      <button class="btn" data-rest="-15">−15 с</button>
      <button class="btn" data-rest="15">+15 с</button>
      <button class="btn btn-primary" data-rest="skip">Пропустити</button>
    </div>
  </div>

  <!-- Згорнуте тренування: смужка над нижньою навігацією на всіх екранах, крім «Тренування» -->
  <div class="workout-bar">
    <button class="icon-btn" id="workout-expand" aria-label="Розгорнути тренування">
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div class="grow">
      <p><span class="dot"></span><strong id="workout-bar-time"></strong></p>
      <p class="card-sub truncate" id="workout-bar-exercise"></p>
    </div>
    <button class="icon-btn" id="workout-discard" aria-label="Скасувати тренування">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
    </button>
  </div>

  <nav class="tabbar">
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg>
      <span>Головна</span>
    </a>
    <a href="#/workout" data-route="workout">
      <svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
      <span>Тренування</span>
    </a>
    <a href="#/profile" data-route="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Профіль</span>
    </a>
  </nav>
</body>
</html>
